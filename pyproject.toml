[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero1d"                      # must be unique on PyPI !
version = "0.1.1"
description = "1D semiconductor heterostructure solver: quantum wells, superlattices, electric and magnetic fields"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ravi Kumar", email = "rkravi365@gmail.com"}]
keywords = ["semiconductor", "quantum well", "heterostructure", "superlattice",
            "Schrodinger", "Poisson", "physics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.20", "scipy>=1.7", "matplotlib>=3.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/erw-del/hetero1d"

[project.scripts]
hetero1d-demo = "hetero1d.examples:main"

[tool.setuptools.packages.find]
where = ["src"]
